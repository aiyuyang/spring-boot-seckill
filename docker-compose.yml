version: '3.8'
services:
  # MySQL 服务
  mysql:
    image: mysql:8.0
    container_name: seckill-mysql
    ports:
      - "3306:3306" # 映射端口
    environment:
      MYSQL_ROOT_PASSWORD: password # 对应你 yml 里的 password
      MYSQL_DATABASE: seckill_db    # 对应你 yml 里的数据库名
    command: --default-authentication-plugin=mysql_native_password # 兼容性配置
    volumes:
      - ./data/mysql:/var/lib/mysql # 数据持久化，防止重启容器数据丢失

  # Redis 服务
  redis:
    image: redis:alpine
    container_name: seckill-redis
    ports:
      - "6379:6379" # 映射端口
    command: redis-server --appendonly yes # 开启AOF持久化

  # RabbitMQ 服务 (虽然你没问，但你的yml里配置了它，不启动的话Spring启动会报错)
  rabbitmq:
    image: rabbitmq:management
    container_name: seckill-rabbitmq
    ports:
      - "5672:5672"  # 通信端口
      - "15672:15672" # 管理后台端口 (访问 http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest