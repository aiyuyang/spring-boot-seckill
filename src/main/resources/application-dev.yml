# 服务器端口配置
server:
  port: 8081
  tomcat:
    threads:
      max: 200 # Tomcat 最大工作线程 (确保能接收并发请求)
      min-spare: 10

# Spring Boot 应用配置
spring:
  application:
    name: seckill-system

  # --- MySQL 数据库连接配置 ---
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 记得保留 createDatabaseIfNotExist=true
    url: jdbc:mysql://localhost:3306/seckill_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: password
    # 【新增】HikariCP 连接池优化 (为了配合MQ消费者入库)
    hikari:
      maximum-pool-size: 20 # 设大一点，防止 10 个 MQ 消费者抢不到连接
      minimum-idle: 10

  # --- SQL 初始化 ---
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true

  # --- Redis 连接配置 ---
  redis:
    host: 127.0.0.1
    port: 6379
    lettuce:
      pool:
        # 【重点】针对压测大幅提升连接数
        # 默认只有8，面对1000并发会瞬间被借光，导致请求报错或等待
        max-active: 100 
        max-idle: 20
        min-idle: 5
        max-wait: 3000ms 

  # --- RabbitMQ 连接配置 ---
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        # 【重点】消费者并发数优化
        # 默认是1，消费速度太慢。改为10个线程同时从队列取消息写入DB
        concurrency: 10
        max-concurrency: 20
        # 每次只预取1条，保证负载均衡
        prefetch: 1

# --- MyBatis-Plus 配置 ---
mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  # configuration:
    # 压测时建议关闭 SQL 日志打印，否则控制台 IO 会拖慢速度
    # 如果想看日志，保留这一行；如果追求极致性能，注释掉或改成 null
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# --- JWT 配置 ---
jwt:
  secret: MySeckillSecretKey_Production_eXtremeL0ng
  expiration: 86400